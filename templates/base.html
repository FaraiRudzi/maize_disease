<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Maize Leaf Check{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Maize Leaf Check</a>
    <nav>
      <a href="{{ url_for('index') }}">Check a leaf</a>
      <a href="{{ url_for('dashboard') }}">Extension officers</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>This tool gives a first opinion from a photo. It does not replace advice from an extension officer.</footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
